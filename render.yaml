services:
  - type: web
    name: barva-vision
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: enquiries
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: VITE_API
        value: server
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /var/data
      - key: OWNER_EMAIL
        value: hello@barvavision.com
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: DAILY_AI_CALL_LIMIT
        value: 300
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Barva Vision <hello@barvavision.com>
